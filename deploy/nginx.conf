# Adapt server_name, TLS and PHP-FPM socket to your server.
server {
    listen 80;
    server_name outing.example.edu;
    root /srv/outing-system-test/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    # Legacy .php URLs are routes, not executable files.
    location ~ \.php$ { rewrite ^ /index.php last; }
    location ~ /\. { deny all; }
}
